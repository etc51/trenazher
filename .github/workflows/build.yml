name: Сборка

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TRENAZHER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: index.json совпадает с базой
        run: |
          python3 tools/make_index.py
          git diff --exit-code app/src/main/assets/baza/index.json || { echo "Запустите tools/make_index.py и закоммитьте index.json"; exit 1; }

      - name: Тесты и сборка
        env:
          TRENAZHER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TRENAZHER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TRENAZHER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: trenazher-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
